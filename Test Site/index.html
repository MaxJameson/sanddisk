<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sanddisk — Test Site</title>

  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
    .controls { margin-bottom: 12px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px; border: 1px solid #ddd; }
    th { background: #f4f4f4; }
    textarea { font-family: monospace; }
  </style>
</head>

<body>

<h1>Sanddisk — Test Site</h1>

<div style="margin-bottom: 15px;">
  <label><b>System Status</b></label><br/>
  <textarea id="systemStatusBox" rows="3"
    style="width:100%; resize:none; background:#111; color:#0f0;" readonly></textarea>
</div>

<div class="controls">
  <label>API base URL:
    <input id="apiUrl" type="text" value="http://localhost:8000" size="30">
  </label>
  <button id="loadBtn">Load drives</button>
  <button id="loadWithPartsBtn">Load drives + partitions</button>
</div>

<div id="status"></div>
<div id="result"></div>

<script>

const apiUrlInput = document.getElementById('apiUrl');
const status = document.getElementById('status');
const result = document.getElementById('result');

function showStatus(msg) {
  status.textContent = msg;
}

/* ================= SYSTEM STATUS ================= */

let polling = false;

async function pollSystemStatus() {
  if (polling) return;
  polling = true;

  try {
    const base = apiUrlInput.value.trim();
    const res = await fetch(base.replace(/\/$/, '') + '/status');
    const data = await res.json();

    document.getElementById('systemStatusBox').value =
      `Status: ${data.status}\nMessage: ${data.activityMessage}`;

  } catch (err) {
    document.getElementById('systemStatusBox').value =
      'Status error: ' + err.message;
  } finally {
    polling = false;
  }
}

setInterval(pollSystemStatus, 2000);
pollSystemStatus();

/* ================= FOLDERS ================= */

async function loadFolders() {
  const base = apiUrlInput.value.trim();
  const res = await fetch(base.replace(/\/$/, '') + '/folders');
  if (!res.ok) throw new Error('Failed to load folders');
  return await res.json();
}

async function populateFolders() {
  console.log('Populating folders...');
  try {
    const folders = await loadFolders();

    const srcSelect = document.getElementById('srcSelect');
    const dstSelect = document.getElementById('dstSelect');

    if (!srcSelect || !dstSelect) return;

    srcSelect.innerHTML = '';
    dstSelect.innerHTML = '';

    folders.forEach(folder => {
      srcSelect.add(new Option(folder, folder));
      dstSelect.add(new Option(folder, folder));
    });

  } catch (err) {
    showStatus('Folder load error: ' + err.message);
  }
}

/* ================= RENDER DRIVES ================= */

function renderDrives(drives) {
  let html = '<table><thead><tr>' +
    '<th>Node</th><th>Vendor</th><th>Model</th><th>Serial</th><th>Size</th>' +
    '</tr></thead><tbody>';

  drives.forEach(d => {
    html += `<tr>
      <td>${d.node || ''}</td>
      <td>${d.vendor || ''}</td>
      <td>${d.model || ''}</td>
      <td>${d.serial || ''}</td>
      <td>${d.size_human || ''}</td>
    </tr>`;
  });

  html += '</tbody></table>';
  result.innerHTML = html;
}

/* ================= DRIVES + PARTITIONS ================= */

function renderDrivesWithParts(drives) {

  let html = `
    <h4>Wipe device</h4>

    <select id="wipeSelect" style="min-width:420px">
  `;

  drives.forEach(d => {
    const parts = d.partitions || [];
    if (!parts.length) return;

    html += `<optgroup label="${d.node} ${d.vendor || ''} ${d.model || ''}">`;

    parts.forEach(p => {
      html += `<option value='${JSON.stringify(p)}'>
        ${p.node} ${p.label || ''} ${p.fstype || ''} ${p.size_human || ''}
      </option>`;
    });

    html += `</optgroup>`;
  });

  html += `
    </select>
    <button id="wipeBtn">Wipe</button>
    <button id="scanBtn">Scan</button>

    <hr/>

    <h4>Copy Files</h4>

    <div>
      <label>Source:</label>
      <select id="srcSelect" style="min-width:420px"></select>
    </div>

    <div>
      <label>Destination:</label>
      <select id="dstSelect" style="min-width:420px"></select>
    </div>

    <button id="startCopyBtn">Start Copy</button>
  `;

  result.innerHTML = html;

  // IMPORTANT: load folders AFTER rendering
  populateFolders();

  /* ================= WIPE ================= */
  document.getElementById('wipeBtn')?.addEventListener('click', async () => {
    const device = JSON.parse(document.getElementById('wipeSelect').value);

    if (!confirm(`WIPE ${device.node}?`)) return;

    showStatus(`Wiping ${device.node}...`);

    await fetch(apiUrlInput.value.replace(/\/$/, '') + '/wipe_device', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ device })
    });
  });

  /* ================= SCAN ================= */
  document.getElementById('scanBtn')?.addEventListener('click', async () => {
    const device = JSON.parse(document.getElementById('wipeSelect').value);

    showStatus(`Scanning ${device.node}...`);

    await fetch(apiUrlInput.value.replace(/\/$/, '') + '/scan_device', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ device })
    });
  });

  /* ================= COPY ================= */
  document.getElementById('startCopyBtn')?.addEventListener('click', async () => {

    const src = document.getElementById('srcSelect').value;
    const dst = document.getElementById('dstSelect').value;

    if (!src || !dst) return showStatus('Select folders');
    if (src === dst) return showStatus('Must be different');

    showStatus(`Copying ${src} → ${dst}...`);

    await fetch(apiUrlInput.value.replace(/\/$/, '') + '/copy_device', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        src_folder: src,
        dst_folder: dst
      })
    });
  });
}

/* ================= LOAD BUTTONS ================= */

async function loadDrives() {
  const base = apiUrlInput.value.trim();
  showStatus('Loading drives...');
  
  const res = await fetch(base.replace(/\/$/, '') + '/drives');
  const data = await res.json();

  renderDrives(data);
}

async function loadDrivesWithParts() {
  const base = apiUrlInput.value.trim();
  showStatus('Loading drives + partitions...');

  console.log('Loading drives with partitions from:', base.replace(/\/$/, '') + '/drives_with_partitions');
  const res = await fetch(base.replace(/\/$/, '') + '/drives_with_partitions');
  const data = await res.json();
  console.log('Received data:', data);
  renderDrivesWithParts(data);
}

document.getElementById('loadBtn').addEventListener('click', loadDrives);
document.getElementById('loadWithPartsBtn').addEventListener('click', loadDrivesWithParts);

</script>

</body>
</html>
