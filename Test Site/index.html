<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sanddisk — Test Site</title>

  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
    .controls { margin-bottom: 12px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px; border: 1px solid #ddd; }
    th { background: #f4f4f4; }
    textarea { font-family: monospace; }

    #killProcessBtn {
      background: #c62828;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    #killProcessBtn:hover {
      background: #b71c1c;
    }

    #partitionBtn {
      margin-top: 10px;
      padding: 8px 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>Sanddisk — Test Site</h1>

<div style="margin-bottom: 15px;">
  <label><b>System Status</b></label><br/>
  <textarea id="systemStatusBox" rows="3"
    style="width:100%; resize:none; background:#111; color:#0f0;" readonly></textarea>
</div>

<div style="margin-bottom: 10px;">
  <button id="killProcessBtn">Kill Running Process</button>
</div>

<div class="controls">
  <label>API base URL:
    <input id="apiUrl" type="text" value="http://localhost:8000" size="30">
  </label>
  <button id="loadBtn">Load drives</button>
  <button id="loadWithPartsBtn">Load drives + partitions</button>
</div>

<div id="status"></div>
<div id="result"></div>

<hr/>

<h4>Partition Empty Drive (4GB)</h4>

<div>
  <label>Drive:</label>
  <select id="emptyDriveSelect" style="min-width:420px"></select>
</div>

<div style="margin-top:8px;">
  <label>Partition Name:</label>
  <input id="partNameInput" type="text" placeholder="e.g. DATA" />
</div>

<button id="partitionBtn">Create Partition</button>

<script>

const apiUrlInput = document.getElementById('apiUrl');
const status = document.getElementById('status');
const result = document.getElementById('result');

function showStatus(msg) {
  status.textContent = msg;
}

/* ================= SYSTEM STATUS ================= */

let polling = false;

async function pollSystemStatus() {
  if (polling) return;
  polling = true;

  try {
    const base = apiUrlInput.value.trim();
    const res = await fetch(base.replace(/\/$/, '') + '/status');
    const data = await res.json();

    document.getElementById('systemStatusBox').value =
      `Status: ${data.status}\nMessage: ${data.activityMessage}`;

  } catch (err) {
    document.getElementById('systemStatusBox').value =
      'Status error: ' + err.message;
  } finally {
    polling = false;
  }
}

setInterval(pollSystemStatus, 2000);
pollSystemStatus();

/* ================= KILL PROCESS ================= */

document.getElementById('killProcessBtn')
  .addEventListener('click', async () => {

    if (!confirm('Terminate the currently running process?')) return;

    try {
      showStatus('Sending terminate request...');

      const response = await fetch(
        apiUrlInput.value.replace(/\/$/, '') + '/kill_process'
      );

      const data = await response.json();
      showStatus(data.status || 'Terminate request sent');

      pollSystemStatus();

    } catch (err) {
      showStatus('Failed to terminate process: ' + err.message);
    }
  });

/* ================= EMPTY DRIVES ================= */

async function loadEmptyDrives() {
  const base = apiUrlInput.value.trim();

  const res = await fetch(base.replace(/\/$/, '') + '/empty_drives');
  const drives = await res.json();

  const select = document.getElementById('emptyDriveSelect');
  select.innerHTML = '';

  drives.forEach(d => {
    const label = `${d.node} ${d.vendor || ''} ${d.model || ''} ${d.size_human || ''}`;
    select.add(new Option(label, JSON.stringify(d)));
  });
}

/* ================= TABLE VIEW ================= */

function renderDrives(drives) {
  let html = '<table><thead><tr>' +
    '<th>Node</th><th>Vendor</th><th>Model</th><th>Serial</th><th>Size</th>' +
    '</tr></thead><tbody>';

  drives.forEach(d => {
    html += `<tr>
      <td>${d.node || ''}</td>
      <td>${d.vendor || ''}</td>
      <td>${d.model || ''}</td>
      <td>${d.serial || ''}</td>
      <td>${d.size_human || ''}</td>
    </tr>`;
  });

  html += '</tbody></table>';
  result.innerHTML = html;
}

/* ================= PARTITION UI ================= */

function renderDrivesWithParts(drives) {

  let html = `
    <h4>Wipe device</h4>

    <select id="wipeSelect" style="min-width:420px">
  `;

  drives.forEach(d => {
    const parts = d.partitions || [];

    if (!parts.length) return;

    html += `<optgroup label="${d.node} ${d.vendor || ''} ${d.model || ''}">`;

    parts.forEach(p => {
      html += `<option value='${JSON.stringify(p)}'>
        ${p.node} ${p.label || ''} ${p.fstype || ''} ${p.size_human || ''}
      </option>`;
    });

    html += `</optgroup>`;
  });

  html += `
    </select>

    <button id="wipeBtn">Wipe</button>
    <button id="scanBtn">Scan</button>

    <hr/>

    <h4>Copy Files</h4>

    <div>
      <label>Source:</label>
      <select id="srcSelect" style="min-width:420px"></select>
    </div>

    <div>
      <label>Destination:</label>
      <select id="dstSelect" style="min-width:420px"></select>
    </div>

    <button id="startCopyBtn">Start Copy</button>

    <hr/>

    <h4>AV Scan Folder</h4>

    <div>
      <label>Folder:</label>
      <select id="scanFolderSelect" style="min-width:420px"></select>
    </div>

    <button id="scanFolderBtn">Start AV Scan</button>
  `;

  result.innerHTML = html;

  populateFolders();
}

/* ================= FOLDERS ================= */

async function loadFolders() {
  const base = apiUrlInput.value.trim();
  const res = await fetch(base.replace(/\/$/, '') + '/folders');
  return await res.json();
}

async function populateFolders() {
  try {
    const folders = await loadFolders();

    const srcSelect = document.getElementById('srcSelect');
    const dstSelect = document.getElementById('dstSelect');
    const scanFolderSelect = document.getElementById('scanFolderSelect');

    if (!srcSelect || !dstSelect) return;

    srcSelect.innerHTML = '';
    dstSelect.innerHTML = '';

    if (scanFolderSelect) scanFolderSelect.innerHTML = '';

    folders.forEach(folder => {
      srcSelect.add(new Option(folder, folder));
      dstSelect.add(new Option(folder, folder));
      if (scanFolderSelect) scanFolderSelect.add(new Option(folder, folder));
    });

  } catch (err) {
    showStatus('Folder load error: ' + err.message);
  }
}

/* ================= LOAD DRIVES ================= */

async function loadDrives() {
  const base = apiUrlInput.value.trim();

  showStatus('Loading drives...');

  const res = await fetch(base.replace(/\/$/, '') + '/drives');
  const data = await res.json();

  renderDrives(data);

  await loadEmptyDrives();
}

/* ================= LOAD DRIVES + PARTITIONS (FIXED) ================= */

async function loadDrivesWithParts() {
  const base = apiUrlInput.value.trim();

  showStatus('Loading drives + partitions...');

  const res = await fetch(base.replace(/\/$/, '') + '/drives_with_partitions');
  const data = await res.json();

  renderDrivesWithParts(data);

  // ✅ FIX: ensure dropdown is populated here too
  await loadEmptyDrives();
}

/* ================= PARTITION ACTION ================= */

document.getElementById('partitionBtn')
  .addEventListener('click', async () => {

    const select = document.getElementById('emptyDriveSelect');
    const partName = document.getElementById('partNameInput').value.trim();

    if (!select.value) return showStatus('Select a drive');
    if (!partName) return showStatus('Enter partition name');

    const drive = JSON.parse(select.value);

    showStatus(`Partitioning ${drive.node}...`);

    try {
      const base = apiUrlInput.value.trim();

      const res = await fetch(base.replace(/\/$/, '') + '/partition_drive', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          drive,
          partName
        })
      });

      const data = await res.json();
      showStatus(data.status || 'Done');

      await loadEmptyDrives();

    } catch (err) {
      showStatus('Partition failed: ' + err.message);
    }
  });

/* ================= BUTTONS ================= */

document.getElementById('loadBtn')
  .addEventListener('click', loadDrives);

document.getElementById('loadWithPartsBtn')
  .addEventListener('click', loadDrivesWithParts);

</script>

</body>
</html>
