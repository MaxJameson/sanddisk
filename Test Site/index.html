<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sanddisk — Test Site</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
    .controls { margin-bottom: 12px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px; border: 1px solid #ddd; }
    th { background: #f4f4f4; }
    pre { background: #fafafa; padding: 8px; border: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>Sanddisk — Test Site</h1>
  <div class="controls">
    <label>API base URL: <input id="apiUrl" type="text" value="http://localhost:8000" size="30"></label>
    <button id="loadBtn">Load drives</button>
    <button id="loadWithPartsBtn">Load drives + partitions</button>
  </div>
  <div id="status"></div>
  <div id="result"></div>

  <script>
    const loadBtn = document.getElementById('loadBtn');
    const apiUrlInput = document.getElementById('apiUrl');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    function showStatus(msg) { status.textContent = msg; }
    function renderDrives(drives) {
      if (!Array.isArray(drives)) {
        result.innerHTML = '<pre>Unexpected response</pre>';
        return;
      }
      if (drives.length === 0) {
        result.innerHTML = '<p>No drives found.</p>';
        return;
      }
      let html = '<table><thead><tr><th>Node</th><th>Vendor</th><th>Model</th><th>Serial</th><th>Size</th><th>Label</th><th>FSType</th></tr></thead><tbody>';
      drives.forEach(d => {
        const node = d.node || '';
        const vendor = d.vendor || '';
        const model = d.model || '';
        const serial = d.serial || '';
        const size = d.size_human || d.size || '';
        const label = d.label || '';
        const fstype = d.fstype || '';
        html += `<tr><td>${node}</td><td>${vendor}</td><td>${model}</td><td>${serial}</td><td>${size}</td><td>${label}</td><td>${fstype}</td></tr>`;
      });
      html += '</tbody></table>';
      result.innerHTML = html;
    }

    async function loadWithParts() {
      const base = apiUrlInput.value.trim();
      if (!base) return showStatus('Enter API base URL');
      showStatus('Fetching...');
      result.innerHTML = '';
      try {
        const res = await fetch(base.replace(/\/$/, '') + '/drives_with_partitions');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        showStatus('Loaded ' + (Array.isArray(data) ? data.length : 'result'));
        renderDrivesWithParts(data);
      } catch (err) {
        showStatus('Error: ' + err.message);
        result.innerHTML = '<pre>' + err.toString() + '</pre>';
      }
    }

    function renderDrivesWithParts(drives) {
      if (!Array.isArray(drives)) {
        result.innerHTML = '<pre>Unexpected response</pre>';
        return;
      }
      if (drives.length === 0) {
        result.innerHTML = '<p>No drives found.</p>';
        return;
      }

      // Build a single dropdown with partitions grouped by drive
      let html = '<div><label for="allPartitions">Choose partition:</label> ' +
                 '<select id="allPartitions" style="min-width:420px">';
      drives.forEach(d => {
        const parts = d.partitions || [];
        if (parts.length === 0) return;
        html += `<optgroup label="${d.node} ${d.vendor || ''} ${d.model || ''} - ${d.size_human || ''}">`;
        parts.forEach(p => {
          html += `<option value="${p.node}">${p.node} ${p.label || ''} ${p.fstype || ''} ${p.size_human || ''}</option>`;
        });
        html += '</optgroup>';
      });
      html += '</select> <button id="submitPartitionBtn">Submit</button></div>';

      // Add copy UI: source and destination selects
      html += '<hr/><h4>Copy device</h4>';
      html += '<div><label for="srcSelect">Source:</label> <select id="srcSelect" style="min-width:420px">';
      drives.forEach(d => {
        const parts = d.partitions || [];
        if (parts.length === 0) return;
        html += `<optgroup label="${d.node} ${d.vendor || ''} ${d.model || ''}">`;
        parts.forEach(p => html += `<option value="${p.node}">${d.node} ${d.vendor || ''} ${d.model || ''} - ${p.node} ${p.label || ''} ${p.size_human || ''}</option>`);
        html += '</optgroup>';
      });
      html += '</select></div>';

      html += '<div><label for="dstSelect">Destination:</label> <select id="dstSelect" style="min-width:420px">';
      drives.forEach(d => {
        const parts = d.partitions || [];
        if (parts.length === 0) return;
        html += `<optgroup label="${d.node} ${d.vendor || ''} ${d.model || ''}">`;
        parts.forEach(p => html += `<option value="${p.node}">${d.node} ${d.vendor || ''} ${d.model || ''} - ${p.node} ${p.label || ''} ${p.size_human || ''}</option>`);
        html += '</optgroup>';
      });
      html += '</select> <button id="startCopyBtn">Start Copy</button></div>';

      result.innerHTML = html;

      // attach handler for the single submit button
      const submitBtn = document.getElementById('submitPartitionBtn');
      if (submitBtn) {
        submitBtn.addEventListener('click', async () => {
          const sel = document.getElementById('allPartitions');
          if (!sel) return showStatus('No partition selected');
          const device = sel.value;
          showStatus('Submitting ' + device);
          try {
            const res = await fetch(apiUrlInput.value.replace(/\/$/, '') + '/select_partition', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ device }),
            });
            const data = await res.json();
            showStatus('Response: ' + JSON.stringify(data));
          } catch (err) {
            showStatus('Submit error: ' + err.message);
          }
        });
      }

      // Start copy handler
      const startCopyBtn = document.getElementById('startCopyBtn');
      if (startCopyBtn) {
        startCopyBtn.addEventListener('click', async () => {
          const src = document.getElementById('srcSelect').value;
          const dst = document.getElementById('dstSelect').value;
          if (!src || !dst) return showStatus('Select both source and destination');
          showStatus(`Starting copy ${src} -> ${dst}`);
          try {
            const res = await fetch(apiUrlInput.value.replace(/\/$/, '') + '/copy_device', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ src, dst }),
            });
            const data = await res.json();
            console.log("copy response:", data);
            if (data.error) {
            showStatus('Copy error: ' + data.error);
            } else {
            showStatus('Copy started: job=' + data.job_id);
            }
          } catch (err) {
            showStatus('Copy request failed: ' + err.message);
          }
        });
      }
    }

    loadBtn.addEventListener('click', async () => {
      const base = apiUrlInput.value.trim();
      if (!base) return showStatus('Enter API base URL');
      showStatus('Fetching...');
      result.innerHTML = '';
      try {
        const res = await fetch(base.replace(/\/$/, '') + '/drives');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        showStatus('Loaded ' + (Array.isArray(data) ? data.length : 'result'));
        renderDrives(data);
      } catch (err) {
        showStatus('Error: ' + err.message);
        result.innerHTML = '<pre>' + err.toString() + '</pre>';
      }
    });

    document.getElementById('loadWithPartsBtn').addEventListener('click', loadWithParts);
  </script>
</body>
</html>
